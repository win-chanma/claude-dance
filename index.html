<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="20種類の音アイコンを7人のClaudeくんにドロップして、自分だけの曲を組み立てる音楽ステージ。">
<title>Claudeくんダンス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: disco stage with 7 performer slots on top, a sound-icon tray (4 categories) below */
:root{
  --night:#140f2e; --stage:#1c1542; --panel:#221a4e; --line:#3a2f78;
  --clay:#ec8a5e; --cream:#fff3e3; --mint:#5fe3c0; --pink:#ff6fae; --sun:#ffd166; --violet:#9b8cff;
  --muted:#b3a9dd; --ink:#140f2e;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
:root.ura{--night:#08050d;--stage:#0e0714;--panel:#150a1c;--line:#40183a;--clay:#c2414f;--mint:#8cff9e;--sun:#c9f76a;--muted:#8f7aa6}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:14px}
.app{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px;padding-inline:16px;max-width:1100px;margin:0 auto;box-sizing:border-box}
header{display:flex;align-items:baseline;justify-content:space-between;gap:4px 16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--clay)}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.meta b{color:var(--mint);font-weight:700}
.stage{position:relative;flex:1;min-height:max(360px,50vh);border-radius:18px;overflow:hidden;background:var(--stage);border:1px solid var(--line)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.hint{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:13px;color:var(--muted);pointer-events:none;padding-inline:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.btn{font-family:var(--display);font-size:15px;color:var(--ink);background:var(--clay);border:3px solid var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn.alt{background:var(--sun)}
.btn.ghost{background:var(--cream)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tempo{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-left:auto;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.1em}
input[type=range]{accent-color:var(--clay);width:min(140px,34vw)}
.chip{font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:0;color:var(--cream);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.presets{display:flex;flex-wrap:wrap;gap:4px}
.step{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:var(--cream);color:var(--ink);font-weight:800;font-size:16px;line-height:1;cursor:pointer;box-shadow:0 2px 0 var(--ink);padding:0}
.step:active{transform:translateY(2px);box-shadow:none}
.zukan{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted)}
.zukan h2{margin:0 4px 0 0;font-size:11px;letter-spacing:.16em;font-weight:800}
.z{border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700}
.z small{opacity:.75;font-weight:500;margin-left:5px}
.z.found{color:var(--cream)}
.z.on{background:var(--sun);color:var(--ink);border-color:var(--sun)}
output{font-variant-numeric:tabular-nums;font-weight:700;color:var(--cream);min-width:4.5em}
.tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cat{display:grid;gap:10px;min-width:0;border:2px solid var(--cc);border-radius:16px;padding:10px 12px 12px;background:color-mix(in srgb,var(--cc) 13%,var(--panel))}
.cat h2{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:11px;font-weight:700;color:var(--cream)}
.cat h2 .tag{background:var(--cc);color:var(--ink);padding:3px 14px;border-radius:999px;font-family:var(--display);font-size:14px;font-weight:400;letter-spacing:.06em}
.cat h2 small{font-size:11px;opacity:.8;letter-spacing:.03em}
.icons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.snd{display:grid;justify-items:center;gap:4px;background:none;border:0;color:var(--cream);font-family:var(--body);font-weight:700;font-size:11px;cursor:grab;padding:4px 0;border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.snd .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:18px;font-family:var(--display)}
.snd:hover .ic{transform:translateY(-2px)}
.snd.used{opacity:.35}
.snd.used .ic{box-shadow:none;transform:translateY(3px)}
.snd .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ghostIcon{position:fixed;z-index:10;pointer-events:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--ink);color:var(--ink);font-family:var(--display);font-size:20px;transform:translate(-50%,-50%) scale(1.15);box-shadow:0 6px 14px rgba(0,0,0,.5)}
.secret{margin:0;font-size:12px;color:var(--muted);text-align:center;letter-spacing:.06em}
.secret b{color:var(--sun);font-weight:800}
:root.ura h1{animation:shiver 2.4s steps(2) infinite}
@keyframes shiver{0%,92%{transform:none}94%{transform:translate(2px,-1px) skewX(-4deg)}97%{transform:translate(-2px,1px) skewX(3deg)}}
@media (prefers-reduced-motion:reduce){:root.ura h1{animation:none}}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (max-width:700px){.tray{grid-template-columns:1fr}}
@media (max-width:420px){.snd .ic{width:38px;height:38px;font-size:15px}.tempo{margin-left:0}}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Claudeくん<span id="ttl">ダンス</span></h1>
    <div class="meta" id="meta">Opus 5.5 Groove · ♩=<b>124</b> · C major</div>
  </header>

  <div class="stage">
    <canvas id="cv" aria-label="7人のClaudeくんが並ぶステージ。音アイコンをドロップすると演奏し、タップするとミュートします"></canvas>
    <div class="hint" id="hint">音アイコンをClaudeくんにドラッグ（タップでも置けます）。キャラはドラッグで入れ替え、ステージの外に出すと消えます</div>
  </div>

  <div class="bar">
    <button class="btn" id="play">▶ 再生</button>
    <button class="btn alt" id="random">おまかせ</button>
    <button class="btn ghost" id="reset">リセット</button>
    <div class="tempo"><label for="tempo">テンポ</label>
      <div class="presets" id="presets">
        <button class="chip" data-bpm="96" aria-pressed="false">ゆっくり</button>
        <button class="chip" data-bpm="124" aria-pressed="true">ふつう</button>
        <button class="chip" data-bpm="160" aria-pressed="false">はやい</button>
        <button class="chip" data-bpm="200" aria-pressed="false">げきはや</button>
      </div>
      <button class="step" id="slower" aria-label="テンポをおそく">−</button>
      <input type="range" id="tempo" min="80" max="200" value="124">
      <button class="step" id="faster" aria-label="テンポをはやく">＋</button>
      <output id="bpmOut" for="tempo">124 BPM</output>
    </div>
  </div>

  <section class="tray" id="tray" aria-label="音アイコン"></section>
  <section class="zukan" aria-label="えんしゅつ図鑑"><h2>えんしゅつ図鑑 <span id="zcount"></span></h2><div class="zukan" id="zlist"></div></section>
  <p class="secret" id="secret"><b>？</b> ウワサ：なまえの さいごを「<b>ー</b>」と のばす 3人が、<b>あいうえお じゅん</b>に となりどうしで ならぶと、夜が うらがえるらしい…</p>
</div>

<script>
const $ = s => document.querySelector(s);
const mod = (a, n) => ((a % n) + n) % n;
const cv = $('#cv'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){ const r = cv.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1); W = r.width; H = r.height; cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); }
new ResizeObserver(resize).observe(cv); resize();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= 曲の土台（C major / 王道進行 IV-V-iii-vi） ================= */
const PROG = [
  {name:'Fmaj7', root:41, ch:[53,57,60,64]},
  {name:'G',     root:43, ch:[55,59,62,67]},
  {name:'Em7',   root:40, ch:[52,55,59,62]},
  {name:'Am7',   root:45, ch:[57,60,64,67]},
];
const MEL = [
  [72,0,74,0,76,0,79,0, 0,0,76,0,74,0,72,0],
  [74,0,0,76,0,74,0,71, 0,0,67,0,71,0,74,0],
  [76,0,0,79,0,76,0,74, 0,0,71,0,74,0,76,0],
  [81,0,79,0,76,0,79,0, 0,0,0,0,84,0,83,0],
];

// ウラモード用：Aマイナー（和声的短音階）の進行とメロディ
const PROG_U = [
  {name:'Am', root:45, ch:[57,60,64,69]},
  {name:'F',  root:41, ch:[53,57,60,65]},
  {name:'Dm', root:38, ch:[50,53,57,62]},
  {name:'E',  root:40, ch:[52,56,59,64]},
];
const MEL_U = [
  [76,0,0,0,72,0,0,0, 69,0,0,0,72,0,71,0],
  [72,0,0,0,69,0,0,0, 65,0,0,0,69,0,72,0],
  [74,0,0,0,77,0,0,0, 74,0,0,0,69,0,0,0],
  [68,0,71,0,76,0,80,0, 0,0,76,0,0,0,68,0],
];
let ura = false;

/* ================= シンセ ================= */
let ac = null, master, analyser, freqData, noiseBuf, verb, delay, tone, verbGain;
const buses = {};
const mtof = m => 440 * Math.pow(2, (m-69)/12);
function impulse(sec, decay){
  const len = ac.sampleRate*sec, b = ac.createBuffer(2, len, ac.sampleRate);
  for (let c=0;c<2;c++){ const d = b.getChannelData(c); for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, decay); }
  return b;
}
function env(gn, t, a, peak, d){ gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(peak, t+a); gn.gain.exponentialRampToValueAtTime(0.0001, t+a+d); }
function hold(gn, t, a, peak, dur, r){ gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(peak, t+a); gn.gain.setValueAtTime(peak, t+Math.max(a, dur-r)); gn.gain.linearRampToValueAtTime(0, t+dur); }
function osc(type, f, t, dur){ const o = ac.createOscillator(); o.type = type; o.frequency.value = f; o.start(t); o.stop(t+dur+0.05); return o; }

function kick(t, bus, big){
  const o = ac.createOscillator(), gn = ac.createGain();
  o.frequency.setValueAtTime(big ? 120 : 155, t); o.frequency.exponentialRampToValueAtTime(42, t+0.13);
  env(gn, t, 0.003, big ? 1.3 : 0.95, big ? 0.7 : 0.34);
  o.connect(gn); gn.connect(bus); o.start(t); o.stop(t + (big ? 0.8 : 0.42));
}
function noise(t, dur, type, freq, q, peak, bus){
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const gn = ac.createGain(); env(gn, t, 0.002, peak, dur);
  s.connect(f); f.connect(gn); gn.connect(bus);
  s.start(t, Math.random()*0.5); s.stop(t + dur + 0.05);
}
function clap(t, bus, peak = 0.7){ for (let i=0;i<3;i++) noise(t + i*0.011, i<2 ? 0.02 : 0.16, 'bandpass', 1600, 1.2, peak, bus); }
function hat(t, bus, open, peak = 0.2){ noise(t, open ? 0.18 : 0.04, 'highpass', 7500, 0.7, peak, bus); }
function snare(t, bus, peak = 0.5){
  noise(t, 0.17, 'bandpass', 1900, 0.8, peak, bus);
  const o = osc('triangle', 190, t, 0.12), gn = ac.createGain(); env(gn, t, 0.002, peak*0.8, 0.1); o.connect(gn); gn.connect(bus);
}
function rim(t, bus){ const o = osc('square', 1700, t, 0.05), gn = ac.createGain(); env(gn, t, 0.001, 0.12, 0.03); o.connect(gn); gn.connect(bus); }
function bass(t, m, dur, bus){
  const o = osc('sawtooth', mtof(m), t, dur), s = osc('sine', mtof(m), t, dur);
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 6;
  f.frequency.setValueAtTime(1500, t); f.frequency.exponentialRampToValueAtTime(260, t+dur);
  const gn = ac.createGain(); env(gn, t, 0.004, 0.45, dur);
  o.connect(f); s.connect(f); f.connect(gn); gn.connect(bus);
}
function wobble(t, m, dur, bus, rate){
  const o = osc('sawtooth', mtof(m), t, dur), o2 = osc('sawtooth', mtof(m)*1.005, t, dur);
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 9; f.frequency.value = 600;
  const lfo = osc('sine', rate, t, dur), lg = ac.createGain(); lg.gain.value = 500; lfo.connect(lg); lg.connect(f.frequency);
  const gn = ac.createGain(); hold(gn, t, 0.01, 0.22, dur, 0.05);
  o.connect(f); o2.connect(f); f.connect(gn); gn.connect(bus);
}
function laser(t, bus){
  const o = ac.createOscillator(); o.type = 'square';
  o.frequency.setValueAtTime(1800, t); o.frequency.exponentialRampToValueAtTime(140, t+0.18);
  const gn = ac.createGain(); env(gn, t, 0.002, 0.1, 0.18); o.connect(gn); gn.connect(bus); o.start(t); o.stop(t+0.25);
}
function pop(t, m, bus){
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(mtof(m)*0.6, t); o.frequency.exponentialRampToValueAtTime(mtof(m)*1.2, t+0.05);
  const gn = ac.createGain(); env(gn, t, 0.003, 0.25, 0.08); o.connect(gn); gn.connect(bus); o.start(t); o.stop(t+0.15);
}
function lead(t, m, dur, bus){
  const o = osc('square', mtof(m), t, dur), o2 = osc('triangle', mtof(m+12), t, dur);
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 3200;
  const gn = ac.createGain(); env(gn, t, 0.01, 0.13, dur);
  o.connect(f); o2.connect(f); f.connect(gn); gn.connect(bus);
}
function stab(t, notes, dur, bus){
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2000; f.Q.value = 2; f.connect(bus);
  for (const m of notes) for (const dt of [-9, 9]){
    const o = osc('sawtooth', mtof(m), t, dur); o.detune.value = dt;
    const gn = ac.createGain(); env(gn, t, 0.005, 0.05, dur); o.connect(gn); gn.connect(f);
  }
}
function pluck(t, m, bus){
  const o = osc('sawtooth', mtof(m), t, 0.2);
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(4000, t); f.frequency.exponentialRampToValueAtTime(400, t+0.15);
  const gn = ac.createGain(); env(gn, t, 0.002, 0.07, 0.15); o.connect(f); f.connect(gn); gn.connect(bus);
}
function bell(t, m, bus, peak = 0.12, dur = 0.6){
  const o = osc('sine', mtof(m), t, dur), o2 = osc('sine', mtof(m)*2.76, t, dur);
  const gn = ac.createGain(); env(gn, t, 0.003, peak, dur);
  const g2 = ac.createGain(); g2.gain.value = 0.3;
  o.connect(gn); o2.connect(g2); g2.connect(gn); gn.connect(bus);
}
const VOWELS = { u:[[320,1],[800,0.35]], o:[[500,1],[900,0.6],[2600,0.12]], a:[[800,1],[1200,0.6],[2600,0.2]] };
function voice(t, m, dur, vowel, bus, peak = 0.3){
  const o = osc('sawtooth', mtof(m), t, dur);
  const vib = osc('sine', 5.5, t, dur), vg = ac.createGain(); vg.gain.value = 10; vib.connect(vg); vg.connect(o.detune);
  const gn = ac.createGain(); hold(gn, t, 0.03, peak, dur, 0.06);
  for (const [fr, amp] of VOWELS[vowel]){
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fr; f.Q.value = 7;
    const a = ac.createGain(); a.gain.value = amp; o.connect(f); f.connect(a); a.connect(gn);
  }
  gn.connect(bus);
}
function hey(t, bus, pitch = 1){
  const o = ac.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(190*pitch, t); o.frequency.exponentialRampToValueAtTime(260*pitch, t+0.18);
  const gn = ac.createGain(); env(gn, t, 0.01, 0.55, 0.22);
  for (const [fr, q] of [[750, 8], [1250, 10], [2600, 12]]){
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fr; f.Q.value = q; o.connect(f); f.connect(gn);
  }
  gn.connect(bus); o.start(t); o.stop(t+0.35);
}
function poof(t, bus){
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(700, t); o.frequency.exponentialRampToValueAtTime(160, t+0.18);
  const gn = ac.createGain(); env(gn, t, 0.005, 0.22, 0.18); o.connect(gn); gn.connect(bus); o.start(t); o.stop(t+0.3);
  noise(t, 0.12, 'bandpass', 2500, 1, 0.12, bus);
}
// 金属的な響き（808風：非整数比の矩形波を重ねてハイパス）
function metal(t, dur, peak, bus, hp = 7000){
  const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const gn = ac.createGain(); env(gn, t, 0.002, peak, dur);
  for (const r of [205.3, 304.4, 369.6, 522.7, 540, 800]){ const o = osc('square', r*1.6, t, dur); o.connect(f); }
  f.connect(gn); gn.connect(bus);
  noise(t, dur*0.8, 'highpass', hp, 0.7, peak*0.9, bus);
}
function scratch(t, dur, bus){
  const o = ac.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(900, t+dur*0.45); o.frequency.exponentialRampToValueAtTime(140, t+dur);
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 2;
  const gn = ac.createGain(); env(gn, t, 0.004, 0.3, dur);
  o.connect(f); f.connect(gn); gn.connect(bus); o.start(t); o.stop(t+dur+0.05);
  noise(t, dur, 'bandpass', 3000, 1.5, 0.12, bus);
}
function pad(t, notes, dur, bus){
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400; f.connect(bus);
  for (const m of notes) for (const dt of [-12, 0, 12]){
    const o = osc('sawtooth', mtof(m), t, dur); o.detune.value = dt;
    const gn = ac.createGain(); hold(gn, t, dur*0.3, 0.025, dur, dur*0.25); o.connect(gn); gn.connect(f);
  }
}
function boing(t, bus){
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(820, t+0.12);
  const gn = ac.createGain(); env(gn, t, 0.005, 0.25, 0.2); o.connect(gn); gn.connect(bus); o.start(t); o.stop(t+0.3);
}

/* ================= 20種類の音（各音はパターン関数。鳴らしたら長さを返す） ================= */
const CATS = [
  {id:'beat',  name:'ビート',     acc:'cap',    color:'#ec8a5e', desc:'リズムを きざむ ・ ぼうしの子'},
  {id:'fx',    name:'エフェクト', acc:'shades', color:'#9b8cff', desc:'ひくい音や こうか音 ・ サングラスの子'},
  {id:'mel',   name:'メロディ',   acc:'phones', color:'#5fe3c0', desc:'ふしや わおん ・ ヘッドホンの子'},
  {id:'voice', name:'ボイス',     acc:'mic',    color:'#ff8fb8', desc:'うたごえ ・ マイクの子'},
];
const SOUNDS = [

function initAudio(){

  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  master = ac.createGain(); master.gain.value = 0.75;
  analyser = ac.createAnalyser(); analyser.fftSize = 256; freqData = new Uint8Array(analyser.frequencyBinCount);
  tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = ura ? 1700 : 18000;
  master.connect(tone); tone.connect(comp); comp.connect(analyser); analyser.connect(ac.destination);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
  verb = ac.createConvolver(); verb.buffer = impulse(1.8, 2.5);
  verbGain = ac.createGain(); verbGain.gain.value = ura ? 0.6 : 0.25; verb.connect(verbGain); verbGain.connect(master);
  delay = ac.createDelay(1); const fb = ac.createGain(); fb.gain.value = 0.3; const dg = ac.createGain(); dg.gain.value = 0.25;
  delay.connect(fb); fb.connect(delay); delay.connect(dg); dg.connect(master);

    if (S.cat === 'mel' || S.cat === 'voice'){ const sg = ac.createGain(); sg.gain.value = 0.5; b.connect(sg); sg.connect(verb); }
    if (S.id === 'lead' || S.id === 'hey') b.connect(delay);

  setDelayTime();

/* ================= ステージの状態とシーケンサー ================= */
const slots = Array.from({length:7}, () => ({sid:null, muted:false, hit:0, gateEnd:0, pop:0}));
let bpm = 124, playing = false, started = false, anchor = {time:0, beat:0}, nextStep = 0, timer = null, pausedBeat = 0;
const events = [];
function setDelayTime(){ if (ac) delay.delayTime.setTargetAtTime(0.75*60/bpm, ac.currentTime, 0.05); }
const timeOfBeat = b => anchor.time + (b - anchor.beat)*60/bpm;
const beatAt = t => anchor.beat + (t - anchor.time)*bpm/60;
function schedule(step, t){
  const s = mod(step, 16), bar = mod(Math.floor(step/16), 4), P = (ura ? PROG_U : PROG)[bar], sd = 60/bpm/4;
  slots.forEach((sl, i) => {
    if (!sl.sid || sl.muted) return;
    const d = SBY[sl.sid].play(s, bar, t, sd, P, buses[sl.sid]);
    if (d) events.push({t, i, sid:sl.sid, dur:d});
  });
  events.push({t, i:-1, step});
}
function tick(){
  const horizon = ac.currentTime + 0.12;
  for (;;){
    const t = timeOfBeat(nextStep/4);
    if (t > horizon) break;
    if (t >= ac.currentTime - 0.03) schedule(nextStep, t);
    nextStep++;
  }
}
function play(){
  initAudio(); ac.resume();
  anchor = {time: ac.currentTime + 0.05, beat: started ? pausedBeat : 0};
  nextStep = Math.ceil(anchor.beat*4);
  started = true; playing = true;
  clearInterval(timer); timer = setInterval(tick, 25); tick();
  $('#play').textContent = '❚❚ 一時停止';
}
function pause(){
  pausedBeat = Math.max(0, beatAt(ac.currentTime)); playing = false;
  clearInterval(timer); events.length = 0;
  $('#play').textContent = '▶ 再生';
}
function beatNow(){ return Math.max(0, beatAt(ac.currentTime - (ac.outputLatency || 0))); }

function place(sid, i){

  if (i == null) i = slots.findIndex(s => !s.sid);

  if (buses[sid]) buses[sid].gain.setTargetAtTime(1, ac.currentTime, 0.02);

}

    const L = slotLayout()[i]; spawn(16, L.x, L.gy - L.R*1.4, 'confetti', 0.7);

}

}

function slotLayout(){
  const cols = W < 560 ? 4 : 7, rows = Math.ceil(7/cols);
  const R = Math.max(16, Math.min((W/cols)*0.27, (H/rows)*0.13, 62));
  return slots.map((_, i) => {
    const row = Math.floor(i/cols), col = i % cols, inRow = row < rows-1 ? cols : 7 - cols*(rows-1);
    const x = W/2 + (col - (inRow-1)/2)*(W/cols);
    const gy = rows === 1 ? H*0.8 : (row === 0 ? H*0.5 : H*0.86);
    return {x, gy, R};
  });
}
function horizon(){ return (W < 560 ? 0.34 : 0.54)*H; }

function mix(a, c, k){ const A = parseInt(a.slice(1), 16), C = parseInt(c.slice(1), 16);
  const ch = sh => Math.round(((A>>sh)&255) + (((C>>sh)&255) - ((A>>sh)&255))*k);
  return '#' + ((1<<24) | (ch(16)<<16) | (ch(8)<<8) | ch(0)).toString(16).slice(1); }
function lighten(hex, k){ const n = parseInt(hex.slice(1), 16); const c = [n>>16, (n>>8)&255, n&255].map(v => Math.round(v + (255-v)*k)); return `rgb(${c})`; }
function star4(x, y, r, rot){
  g.beginPath();
  for (let i=0;i<8;i++){ const a = rot + i*Math.PI/4, rr = i % 2 ? r*0.4 : r; g.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr); }
  g.closePath();
}
function spawn(n, x, y, kind, spread = 1){

  for (let i=0;i<n;i++) particles.push({x, y, vx:(Math.random()-0.5)*260*spread, vy:-Math.random()*260*spread - 60, life:0, max:1.1 + Math.random()*0.8,
    kind, color:COLORS[i % COLORS.length], rot:Math.random()*6, vr:(Math.random()-0.5)*10, size:5 + Math.random()*7});
}
function callout(text){ callouts.push({text, t0:T}); }

/* ポーズ（角度は腕が下向き=0、外に上がるほど大きい） */
function idlePose(i){ return {x:0, hop:0, tilt:Math.sin(T*1.4 + i)*0.05, sq:Math.sin(T*2.5 + i)*0.1, aL:0.3, aR:0.3, liftL:0, liftR:0, spin:1, mouth:0.08, eyes:'open'}; }
function poseFor(sl, i, b){
  if (!sl.sid) return idlePose(i);
  if (sl.muted) return {...idlePose(i), tilt:0.18, sq:Math.sin(T*1.5 + i)*0.06, eyes:'closed', mouth:0};
  if (!playing) return {...idlePose(i), aR:2.5 + Math.sin(T*6 + i)*0.35};
  const h = sl.hit, gate = ac.currentTime < sl.gateEnd, cat = SBY[sl.sid].cat;
  const e = Math.exp(-mod(b, 1)*7), s = Math.sin(Math.PI*b);
  if (cat === 'beat') return {x:0, hop:Math.abs(s)*0.22, tilt:Math.sin(Math.PI*b/2)*0.13, sq:e*0.6 + h*0.7,
    aL:0.5 + 1.6*(0.5 + 0.5*s), aR:0.5 + 1.6*(0.5 - 0.5*s), liftL:0, liftR:0, spin:1, mouth:0.15 + h*0.7, eyes:h > 0.6 ? 'happy' : 'open'};
  if (cat === 'fx'){
    const PP = [[0.2,2.9],[2.9,0.2],[1.57,1.57],[3.0,3.0]], TL = [-0.15,0.15,0,0];
    const k = mod(Math.floor(b), 4), f = Math.min(1, mod(b, 1)/0.12), q = mod(k-1, 4), L = (a, c) => a + (c-a)*f;
    return {x:0, hop:mod(b, 1) < 0.12 ? 0.08 : 0, tilt:L(TL[q], TL[k]), sq:h*0.8, aL:L(PP[q][0], PP[k][0]), aR:L(PP[q][1], PP[k][1]),
      liftL:0, liftR:0, spin:1, mouth:h*0.6, eyes:'open'};
  }
  if (cat === 'mel'){ const odd = mod(Math.floor(b), 2);
    return {x:Math.sin(Math.PI*b/2)*0.3, hop:Math.abs(s)*0.12, tilt:-Math.cos(Math.PI*b/2)*0.18, sq:h*0.5,
      aL:1.7 + Math.sin(Math.PI*b*2)*0.75, aR:1.7 + Math.sin(Math.PI*b*2 + Math.PI)*0.75,
      liftL:odd ? 0 : Math.abs(s)*0.3, liftR:odd ? Math.abs(s)*0.3 : 0, spin:1, mouth:gate ? 0.5 : h*0.4, eyes:gate ? 'happy' : 'open'}; }
  return {x:0, hop:Math.abs(s)*0.08, tilt:Math.sin(Math.PI*b/2)*0.1, sq:h*0.4, aL:1.3 + s*0.5, aR:-1.0, liftL:0, liftR:0, spin:1,
    mouth:gate ? 0.65 + 0.3*Math.sin(T*18) : 0.05, eyes:gate ? 'happy' : 'open'};
}

function drawChar(L, p, look, i){

  const lw = Math.max(2, R*0.07);

  g.fillStyle = 'rgba(0,0,0,0.38)'; g.beginPath(); g.ellipse(cx, gy + R*0.05, R*0.95*sh, R*0.17*sh, 0, 0, Math.PI*2); g.fill();

      g.beginPath(); g.ellipse(0, z*0.4, z*0.13, z*0.18, 0, 0, Math.PI*2); g.fill();
    }
    else if (p.kind === 'snow'){ g.fillStyle = '#fff3e3'; g.beginPath(); g.arc(0, 0, p.size, 0, Math.PI*2); g.fill(); }
    else if (p.kind === 'shoot'){ g.strokeStyle = '#fff3e3'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(-p.vx*0.12, -p.vy*0.12); g.stroke(); star4(0, 0, 5, 0); g.fillStyle = '#ffd166'; g.fill(); }
    else { g.fillStyle = p.kind === 'heart' ? '#ff6fae' : p.color; g.font = `${p.size*2.4}px sans-serif`; g.textAlign = 'center'; g.fillText(p.kind === 'heart' ? '♥' : '♪', 0, 0); }
    g.restore();
  }
  if (ura){
    const vg = g.createRadialGradient(W/2, H*0.55, Math.min(W, H)*0.3, W/2, H*0.55, Math.max(W, H)*0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  }
  // callouts
  for (let i = callouts.length - 1; i >= 0; i--){
    const c = callouts[i], k = T - c.t0;
    if (k > 1.6){ callouts.splice(i, 1); continue; }
    const sc = k < 0.15 ? k/0.15*1.2 : k < 0.3 ? 1.2 - (k - 0.15)/0.15*0.2 : 1;
    g.save(); g.globalAlpha = k > 1.2 ? 1 - (k - 1.2)/0.4 : 1;
    g.translate(W/2, H*0.16 + i*Math.min(56, W*0.075)*1.2); g.scale(sc, sc); g.rotate(-0.05);
    g.font = `${Math.min(56, W*0.075)}px "Dela Gothic One","Hiragino Sans",sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 8; g.strokeStyle = '#140f2e'; g.strokeText(c.text, 0, 0);
    g.fillStyle = ura ? '#8cff9e' : '#ffd166'; g.fillText(c.text, 0, 0);
    g.restore();
  }
}

/* ---------- メインループ（例外が出ても止まらない） ---------- */
const meta = $('#meta'); let lastMeta = '', lastTs = performance.now(), nextGhost = 0, nextShoot = 0;
function frame(ts){
  requestAnimationFrame(frame);
  try {
    const dt = Math.min(0.05, (ts - lastTs)/1000); lastTs = ts; T += dt;
    const b = playing ? beatNow() : null;
    if (playing){
      const now = ac.currentTime - (ac.outputLatency || 0), LAY = slotLayout();
      while (events.length && events[0].t <= now){
        const e = events.shift();
        if (e.i < 0){ if (mod(e.step, 4) === 0) flash = 1;
          if (fxOn.has('fire') && mod(e.step, 16) === 0) for (let k = 0; k < 2; k++) spawn(26, W*(0.12 + Math.random()*0.76), horizon()*(0.15 + Math.random()*0.5), 'star', 1.2); if (isFever() && mod(e.step, 8) === 0) spawn(4, Math.random()*W, -10, 'confetti', 0.5); continue; }
        const sl = slots[e.i];
        if (sl.sid !== e.sid) continue;
        sl.hit = 1; sl.gateEnd = Math.max(sl.gateEnd, e.t + e.dur);
        const cat = SBY[e.sid].cat;
        if ((cat === 'mel' || cat === 'voice') && Math.random() < 0.5){ const L = LAY[e.i]; spawn(1, L.x, L.gy - L.R*2.6, 'note', 0.3); }
      }
    }
    if (!reduced){
      if (fxOn.has('stars') && T > nextShoot){ nextShoot = T + 0.4 + Math.random()*0.8;
        particles.push({kind:'shoot', x:W*(0.3 + Math.random()*0.8), y:Math.random()*horizon()*0.4, vx:-320 - Math.random()*200, vy:130 + Math.random()*90, life:0, max:0.9, size:2, rot:0, vr:0, color:'#fff3e3'}); }
      if (fxOn.has('snow') && Math.random() < dt*16)
        particles.push({kind:'snow', x:Math.random()*W, y:-6, vx:(Math.random() - 0.5)*24, vy:45 + Math.random()*45, life:0, max:H/50, size:1.5 + Math.random()*2.5, rot:Math.random()*6, vr:1, color:'#fff3e3'});
      if (fxOn.has('hearts') && playing && Math.random() < dt*4){ const L = slotLayout()[Math.floor(Math.random()*7)]; spawn(1, L.x, L.gy - L.R*2.4, 'heart', 0.35); }
    }
    if (ura && T > nextGhost && !reduced){ nextGhost = T + 0.9 + Math.random()*1.2;
      particles.push({kind:'ghost', x:Math.random()*W, y:H*(0.55 + Math.random()*0.4), vx:(Math.random() - 0.5)*24, vy:-38, life:0, max:4.5, size:9 + Math.random()*9, rot:Math.random()*6, vr:1.6, color:'#eaffea'}); }
    flash *= Math.pow(0.02, dt);
    for (const sl of slots){ sl.hit *= Math.pow(0.002, dt); sl.pop *= Math.pow(0.001, dt); }
    blink.forEach(bk => { if (T > bk.at){ bk.k = 0.1; if (T > bk.at + 0.12){ bk.k = 1; bk.at = T + 2.5 + Math.random()*2.5; } } });
    drawScene(b, dt);
    const m = playing ? `♩=<b>${bpm}</b> · BAR <b>${mod(Math.floor(b/4), 4) + 1}</b>/4 · <b>${(ura ? PROG_U : PROG)[mod(Math.floor(b/4), 4)].name}</b> · <b>${slots.filter(s => s.sid && !s.muted).length}</b>/7人` + (isFever() ? ' · <b>FEVER</b>' : '') + (ura ? ' · <b>ウラ</b>' : '')
                      : `Opus 5.5 Groove · ♩=<b>${bpm}</b> · C major`;
    if (m !== lastMeta){ meta.innerHTML = m; lastMeta = m; }
  } catch (err){ console.error(err); }
}
requestAnimationFrame(frame);

/* ================= トレイとドラッグ ================= */
const tray = $('#tray');
for (const c of CATS){
  const box = document.createElement('div'); box.className = 'cat';
  box.style.setProperty('--cc', c.color);
  box.innerHTML = `<h2><span class="tag">${c.name}</span><small>${c.desc}</small></h2><div class="icons"></div>`;
  for (const S of SOUNDS.filter(s => s.cat === c.id)){
    const b = document.createElement('button');
    b.className = 'snd'; b.dataset.sid = S.id; b.style.setProperty('--c', S.body); b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', `${c.name}：${S.name}`);
    b.innerHTML = `<span class="ic">${S.glyph}</span><span class="nm">${S.name}</span>`;
    box.querySelector('.icons').appendChild(b);
  }
  tray.appendChild(box);
}
let drag = null, dragHover = -1;
function slotAt(clientX, clientY){
  const r = cv.getBoundingClientRect(), x = clientX - r.left, y = clientY - r.top;
  if (x < 0 || y < 0 || x > W || y > H) return -1;
  let best = -1, bd = Infinity;
  slotLayout().forEach((L, i) => { const d = Math.hypot(x - L.x, y - (L.gy - L.R*1.3)); if (d < L.R*2.2 && d < bd){ bd = d; best = i; } });
  return best;
}
tray.addEventListener('pointerdown', e => {
  const b = e.target.closest('.snd'); if (!b) return;
  e.preventDefault();
  drag = {sid:b.dataset.sid, from:-1, x0:e.clientX, y0:e.clientY, moved:false, el:null, id:e.pointerId};
});
// ステージ上のキャラ：タップでミュート、ドラッグで移動・入れ替え、ステージ外に出すと削除
cv.addEventListener('pointerdown', e => {
  const i = slotAt(e.clientX, e.clientY);
  if (i < 0 || !slots[i].sid) return;
  e.preventDefault(); initAudio();
  drag = {sid:slots[i].sid, from:i, x0:e.clientX, y0:e.clientY, moved:false, el:null, id:e.pointerId};
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6){
    drag.moved = true;
    const S = SBY[drag.sid], el = document.createElement('div');
    el.className = 'ghostIcon'; el.style.background = S.body; el.textContent = S.glyph; document.body.appendChild(el); drag.el = el;
  }
  if (drag.moved){ drag.el.style.left = e.clientX + 'px'; drag.el.style.top = e.clientY + 'px'; dragHover = slotAt(e.clientX, e.clientY); }
});
function endDrag(e, cancel){
  if (!drag || e.pointerId !== drag.id) return;
  const {sid, from, moved, el} = drag; drag = null; dragHover = -1;
  if (el) el.remove();
  if (cancel) return;
  const i = moved ? slotAt(e.clientX, e.clientY) : -1;
  if (from >= 0){
    if (!moved) toggleMute(from);
    else if (i < 0) removeSid(sid);
    else if (i !== from) swapSlots(from, i);
    return;
  }
  if (moved){ if (i >= 0) place(sid, i); }
  else if (slots.some(s => s.sid === sid)) removeSid(sid);
  else place(sid, null);
}
addEventListener('pointerup', e => endDrag(e, false));
addEventListener('pointercancel', e => endDrag(e, true));
tray.addEventListener('keydown', e => {
  const b = e.target.closest('.snd'); if (!b || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault(); slots.some(s => s.sid === b.dataset.sid) ? removeSid(b.dataset.sid) : place(b.dataset.sid, null);
});

/* ================= ボタン ================= */
$('#play').onclick = () => { if (playing) pause(); else play(); };
$('#random').onclick = () => {
  const free = SOUNDS.map(s => s.id).filter(id => !slots.some(s => s.sid === id)).sort(() => Math.random() - 0.5);
  slots.forEach((sl, i) => { if (!sl.sid && free.length) place(free.pop(), i); });
};
$('#reset').onclick = () => { slots.forEach(s => { s.sid = null; s.muted = false; }); setUra(false); refresh(); };
function setTempo(v){
  v = Math.max(80, Math.min(200, Math.round(v)));
  if (ac && playing){ const now = ac.currentTime; anchor = {time:now, beat:beatAt(now)}; }
  bpm = v; $('#tempo').value = v; $('#bpmOut').textContent = v + ' BPM'; setDelayTime();
  document.querySelectorAll('#presets .chip').forEach(b => b.setAttribute('aria-pressed', +b.dataset.bpm === v));
}
$('#tempo').oninput = e => setTempo(+e.target.value);
$('#presets').onclick = e => { const b = e.target.closest('[data-bpm]'); if (b) setTempo(+b.dataset.bpm); };
$('#slower').onclick = () => setTempo(bpm - 10);
$('#faster').onclick = () => setTempo(bpm + 10);
renderZukan();
addEventListener('keydown', e => {
  if (e.key === ' ' && e.target === document.body){ e.preventDefault(); $('#play').click(); }
});
</script>
</body>
